name: Build Morphe patches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build patch bundle
        run: gradle --no-daemon :patches:build

      - name: Generate patch list
        run: gradle --no-daemon :patches:generatePatchesList

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: morph-patches
          path: |
            patches/build/libs/*.mpp
            patches-list.json
          if-no-files-found: warn
